[package]
name = "ansatz"
version = "0.2.0"
edition = "2024"
rust-version = "1.85.0"
description = "Discretization-agnostic approximation and assembly layer for mechanics problems: you supply the ansatz, a sparse solver does the rest."
keywords = ["fem", "meshfree", "discretization", "tensor", "assembly"]
categories = ["science", "mathematics", "simulation"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/jmwjc/ansatz"
documentation = "https://docs.rs/ansatz"
# Development-only material is kept out of the published package.
exclude = ["book/", "dhat-heap.json", "PLAN.md", "AGENTS.md"]

[dependencies]
faer = "0.24.4"
dhat = { version = "0.3.3", optional = true }
rayon = { version = "1.12.0", optional = true }

[profile.release]
debug = 1

[dev-dependencies]
plotters = "0.3.7"
tempfile = "3"
toml = "1"

[features]
default = ["sparse"]
dhat-heap = ["dep:dhat"]    # if you are doing heap profiling
dhat-ad-hoc = ["dep:dhat"]  # if you are doing ad hoc profiling
std = []
sparse = []
parallel = ["dep:rayon"]
