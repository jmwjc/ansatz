[package]
name = "rustfem"
version = "0.1.0"
edition = "2024"

[dependencies]
faer = "0.24.4"
dhat = { version = "0.3.3", optional = true }
rayon = { version = "1.12.0", optional = true }

[profile.release]
debug = 1

[dev-dependencies]
plotters = "0.3.7"
tempfile = "3"
toml = "1"

[features]
default = ["sparse"]
dhat-heap = ["dep:dhat"]    # if you are doing heap profiling
dhat-ad-hoc = ["dep:dhat"]  # if you are doing ad hoc profiling
std = []
sparse = []
parallel = ["dep:rayon"]
